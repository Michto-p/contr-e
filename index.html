<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrées vivantes — chronique</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<main>
  <header class="intro">
    <h1>Contrées vivantes</h1>
    <p>Étape 1 : la simulation seule. Le monde tourne heure par heure, les joueurs simulés vont et viennent, et la chronique raconte ce qui s'est passé.</p>
  </header>

  <form id="f" class="controls">
    <label>Graine <input name="seed" type="number" min="0" value="42"></label>
    <label>Jours <input name="days" type="number" min="1" max="120" value="7"></label>
    <label>Joueurs
      <select name="agents">
        <option value="mixte">mixte</option>
        <option value="assidus">tous assidus</option>
        <option value="absents">tous absents</option>
      </select>
    </label>
    <label>Depuis le jour <input name="since" type="number" min="1" placeholder="—"></label>
    <label class="check"><input name="debug" type="checkbox"> chiffres</label>
    <button type="submit">Simuler</button>
  </form>
  <div id="meta" class="meta"></div>
  <p id="contree" class="contree"></p>

  <section class="card viewer" id="viewer" aria-label="Vue du jour">
    <div class="daybar">
      <div class="daytitle">
        <h2 id="day-title">Jour 1</h2>
        <span id="day-sub" class="muted"></span>
      </div>
      <div class="daynav">
        <button type="button" id="prev" class="ghost" aria-label="Jour précédent">◀</button>
        <button type="button" id="play" class="ghost" aria-label="Lecture">▶ Lecture</button>
        <button type="button" id="next" class="ghost" aria-label="Jour suivant">▶</button>
      </div>
      <input id="slider" type="range" min="1" max="7" value="1" aria-label="Jour affiché">
    </div>

    <div class="viewer-grid">
      <div class="map-col">
        <div class="layer-row" role="radiogroup" aria-label="Calque de la carte">
          <button type="button" class="seg" data-layer="monstres" aria-pressed="true">Monstres</button>
          <button type="button" class="seg" data-layer="chemins" aria-pressed="false">Chemins</button>
          <button type="button" class="seg" data-layer="terrain" aria-pressed="false">Terrain</button>
        </div>
        <div class="map-wrap"><svg id="map" role="img" aria-label="Carte de la contrée"></svg></div>
        <div id="map-legend" class="legend"></div>
      </div>

      <div class="side-col">
        <h3>Le village</h3>
        <div id="village"></div>
        <h3>Ce jour-là</h3>
        <ul id="day-lines" class="day-lines"></ul>
      </div>
    </div>
  </section>

  <section class="charts">
    <figure class="card chart-card">
      <figcaption>
        <strong>Pression des monstres</strong>
        <span class="muted">moyenne par distance au village, sur 100</span>
      </figcaption>
      <div id="legend-pressure" class="legend"></div>
      <div class="chart" id="chart-pressure"></div>
    </figure>
    <figure class="card chart-card">
      <figcaption>
        <strong>Satisfaction des métiers</strong>
        <span class="muted">sur 100 ; en dessous de 45 trop longtemps, le métier perd un niveau</span>
      </figcaption>
      <div id="legend-jobs" class="legend"></div>
      <div class="chart" id="chart-jobs"></div>
    </figure>
  </section>

  <details class="card data-table">
    <summary>Données jour par jour</summary>
    <div class="table-wrap"><table id="table"></table></div>
  </details>

  <section class="chronicle" id="out" aria-label="Chronique complète"></section>
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script type="module" src="web/app.js"></script>
</body>
</html>
